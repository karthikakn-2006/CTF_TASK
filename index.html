<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal // CTF Training Grounds</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0B0F14;
    --panel: #121821;
    --panel-raised: #171F2A;
    --line: #232E3C;
    --text: #E6EDF3;
    --text-muted: #7C8B9B;
    --amber: #E8A33D;
    --amber-dim: #8A6427;
    --teal: #3FB8AF;
    --red: #D9534F;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{min-height:100vh;}
  ::selection{background:var(--amber-dim);color:#fff;}

  a{color:var(--teal);}

  .shell{
    display:grid;
    grid-template-columns: 300px 1fr;
    min-height:100vh;
  }
  @media (max-width: 860px){
    .shell{grid-template-columns:1fr;}
    .sidebar{order:2; border-right:none; border-top:1px solid var(--line);}
    .main{order:1;}
  }

  /* ---- Sidebar ---- */
  .sidebar{
    background: var(--panel);
    border-right:1px solid var(--line);
    padding:28px 20px 40px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .brand{
    display:flex; flex-direction:column; gap:4px;
  }
  .brand .glyph{
    font-family:var(--mono); font-size:13px; color:var(--amber); letter-spacing:0.02em;
  }
  .brand h1{
    font-family:var(--mono); font-size:20px; margin:0; font-weight:600; letter-spacing:-0.01em;
  }
  .brand p{
    margin:0; color:var(--text-muted); font-size:13px; line-height:1.5;
  }

  .score-block{
    background:var(--panel-raised);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
  }
  .score-row{
    display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;
  }
  .score-row .label{font-size:12px; color:var(--text-muted);}
  .score-row .value{font-family:var(--mono); font-size:20px; color:var(--amber);}
  .bar{
    height:6px; background:var(--line); border-radius:3px; overflow:hidden;
  }
  .bar-fill{
    height:100%; background:linear-gradient(90deg, var(--teal), var(--amber));
    width:0%; transition:width .4s ease;
  }

  .cat-group{display:flex; flex-direction:column; gap:2px;}
  .cat-label{
    font-family:var(--mono); font-size:11px; color:var(--text-muted);
    padding:10px 8px 6px; letter-spacing:0.03em;
  }
  .chal-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 10px; border-radius:5px; cursor:pointer;
    border:1px solid transparent;
    font-size:13.5px;
  }
  .chal-item:hover{background:var(--panel-raised);}
  .chal-item.active{
    background:var(--panel-raised); border-color:var(--amber-dim);
  }
  .chal-status{
    width:16px; height:16px; border-radius:50%; flex-shrink:0;
    border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:10px; color:var(--bg);
  }
  .chal-status.done{background:var(--teal); border-color:var(--teal); color:#0B0F14;}
  .chal-title{color:var(--text); flex:1; line-height:1.3;}
  .chal-diff{
    font-family:var(--mono); font-size:10px; padding:2px 6px; border-radius:3px;
    color:var(--text-muted); border:1px solid var(--line);
  }
  .chal-diff.easy{color:var(--teal); border-color:#1e4440;}
  .chal-diff.med{color:var(--amber); border-color:var(--amber-dim);}

  /* ---- Main ---- */
  .main{
    padding:40px 56px;
    max-width:760px;
  }
  @media (max-width:860px){ .main{padding:28px 22px;} }

  .empty-state{
    color:var(--text-muted); font-size:14px; line-height:1.7; max-width:520px;
  }

  .chal-header{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:6px;
  }
  .chal-header h2{
    font-family:var(--mono); font-size:26px; margin:0; font-weight:600; letter-spacing:-0.01em;
  }
  .chal-meta{
    display:flex; gap:8px; align-items:center; margin-bottom:24px;
  }
  .pill{
    font-family:var(--mono); font-size:11px; padding:3px 8px; border-radius:3px;
    border:1px solid var(--line); color:var(--text-muted);
  }

  .brief{
    font-size:15px; line-height:1.7; color:var(--text); margin-bottom:20px;
  }
  .brief p{margin:0 0 12px;}
  .brief code{
    font-family:var(--mono); background:var(--panel-raised); padding:1px 5px; border-radius:3px; font-size:0.92em;
  }

  .terminal{
    background:#080B0F; border:1px solid var(--line); border-radius:6px;
    padding:18px 20px; margin-bottom:22px; overflow-x:auto;
  }
  .terminal .tline{
    font-family:var(--mono); font-size:13.5px; line-height:1.8; color:var(--teal);
    white-space:pre-wrap; word-break:break-all;
  }
  .terminal .tprefix{color:var(--text-muted);}

  .hint-block{
    margin-bottom:22px;
  }
  .hint-toggle{
    background:none; border:1px solid var(--line); color:var(--text-muted);
    font-family:var(--sans); font-size:13px; padding:7px 14px; border-radius:5px; cursor:pointer;
  }
  .hint-toggle:hover{border-color:var(--amber-dim); color:var(--amber);}
  .hint-text{
    margin-top:10px; font-size:13.5px; color:var(--text-muted); line-height:1.6;
    padding:12px 14px; background:var(--panel); border-left:2px solid var(--amber-dim); border-radius:0 4px 4px 0;
    display:none;
  }
  .hint-text.show{display:block;}

  .submit-row{
    display:flex; gap:10px; margin-bottom:14px;
  }
  .submit-row input{
    flex:1; background:var(--panel-raised); border:1px solid var(--line); color:var(--text);
    font-family:var(--mono); font-size:14px; padding:11px 14px; border-radius:5px; outline:none;
  }
  .submit-row input:focus{border-color:var(--amber-dim);}
  .submit-row button{
    background:var(--amber); border:none; color:#1A1305; font-weight:600;
    font-family:var(--sans); font-size:14px; padding:0 22px; border-radius:5px; cursor:pointer;
  }
  .submit-row button:hover{background:#f0ae4a;}
  .submit-row button:disabled{background:var(--line); color:var(--text-muted); cursor:default;}

  .feedback{
    font-size:13.5px; font-family:var(--mono); padding:10px 14px; border-radius:5px; margin-bottom:8px;
    display:none;
  }
  .feedback.ok{display:block; background:rgba(63,184,175,0.1); color:var(--teal); border:1px solid #1e4440;}
  .feedback.err{display:block; background:rgba(217,83,79,0.1); color:var(--red); border:1px solid #4a2422;}

  .concept-note{
    margin-top:28px; padding-top:20px; border-top:1px solid var(--line);
    font-size:13px; color:var(--text-muted); line-height:1.7;
  }
  .concept-note strong{color:var(--text);}

  footer{
    margin-top:36px; font-size:12px; color:var(--text-muted); font-family:var(--mono);
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="glyph">&gt;_ signal</span>
      <h1>CTF Training Grounds</h1>
      <p>Ten self-contained puzzles covering encoding, classical crypto, and web-security fundamentals. Everything runs locally in your browser — nothing here touches a real system.</p>
    </div>

    <div class="score-block">
      <div class="score-row">
        <span class="label">Solved</span>
        <span class="value" id="scoreValue">0 / 10</span>
      </div>
      <div class="bar"><div class="bar-fill" id="scoreBar"></div></div>
    </div>

    <div id="sidebarList"></div>
  </aside>

  <main class="main" id="mainPanel"></main>
</div>

<!-- flag{always_check_the_page_source} — if you're reading this in DevTools or "View Page Source", challenge 10 is solved. -->


<script>
const FLAG_FORMAT_HELP = "Flags look like flag{...}. Submit the whole string, lowercase, exactly as decoded.";

const challenges = [
  {
    id: 1, cat: "Encoding", diff: "easy", title: "Base64 Basics",
    hashHex: "d7ba614676b457e3e6c432df3d5965368400fd07723d23b85ddbbba4e8e781c3",
    brief: `<p>Base64 turns arbitrary bytes into a text-safe alphabet of 64 characters. It's used everywhere — email attachments, data URIs, API tokens — but it is <strong>encoding, not encryption</strong>: no key is involved, and anyone can reverse it.</p><p>Decode the string below to find the flag.</p>`,
    terminal: `ZmxhZ3tiYXNlNjRfaXNfbm90X2VuY3J5cHRpb259`,
    hint: "Any base64 decoder will do — including a one-liner: atob('...') in your browser's console, or `base64 -d` in a terminal.",
    concept: "Recognizing base64 by its alphabet (A–Z, a–z, 0–9, +, /) and = padding is a core triage skill: it tells you instantly that no key is needed."
  },
  {
    id: 2, cat: "Crypto", diff: "easy", title: "Caesar's Secret",
    hashHex: "056d715ffdf80c09ce94e628912776ecd449f36c8527efbbbf35889f37641341",
    brief: `<p>The Caesar cipher shifts every letter of the alphabet by a fixed number of positions. Julius Caesar reportedly used a shift of 3 — but here the shift is unknown to you.</p><p>Decrypt the ciphertext to recover the flag. There are only 25 possible shifts, so brute-forcing all of them takes seconds.</p>`,
    terminal: `synl{pnrfne_pnag_ubqr_sebz_serdhrapl}`,
    hint: "This one is actually ROT13 — a Caesar shift of 13 — which is its own inverse. Applying it twice gets you back the plaintext.",
    concept: "Caesar ciphers preserve letter frequency, which is exactly what makes them breakable: the most common ciphertext letter is almost always a shifted 'e' or 't' in English text."
  },
  {
    id: 3, cat: "Encoding", diff: "easy", title: "Hexadecimal Hideout",
    hashHex: "a781022b14ee27819d1f47938631719018280828b34ec715e42423eb7552b062",
    brief: `<p>Hex encoding represents each byte as two hexadecimal digits (0–9, a–f). It's the format you'll see constantly in memory dumps, hashes, and packet captures.</p><p>Convert the hex string below to ASCII to reveal the flag.</p>`,
    terminal: `666c61677b6865785f6465636f6465645f6c696b655f615f70726f7d`,
    hint: "Each pair of hex digits is one character. 66 = 'f', 6c = 'l', 61 = 'a', 67 = 'g' — you can already see where this is going.",
    concept: "Hex is just a different base for representing the same bytes as text — no cleverness required, just a lookup table."
  },
  {
    id: 4, cat: "Crypto", diff: "easy", title: "ROT13 Runaround",
    hashHex: "e73124fdf8b5cf577eb5c20cac3ae22fd3c20996684881ca68e17428c7db918a",
    brief: `<p>ROT13 is the Caesar cipher fixed at a shift of 13 — half of the 26-letter alphabet. That symmetry means encoding and decoding are the exact same operation.</p><p>Rotate the text below by 13 to find the flag.</p>`,
    terminal: `synt{ebg13_vf_pnrfne_13}`,
    hint: "Map each letter 13 positions forward (wrapping past z back to a). Online 'ROT13 decoder' tools do this instantly.",
    concept: "ROT13 was never meant to be secure — it's historically used to hide spoilers or puzzle answers from casual glances, not from anyone who's actually trying."
  },
  {
    id: 5, cat: "Crypto", diff: "med", title: "XOR Marks the Spot",
    hashHex: "bf896f6fb9050c742d1a884450a8ec8f5c23b7b64063664a5de407189f01cd51",
    brief: `<p>A single-byte XOR cipher combines every byte of the plaintext with one repeating key byte. It's weak — with only 256 possible keys, it's trivial to brute-force — but it's the building block that repeating-key XOR (and eventually stream ciphers) grow out of.</p><p>The flag below was XORed with a single byte and then hex-encoded. Recover the key and the plaintext.</p>`,
    terminal: `1e0207005a595b0c19075812065919520e074f56070c1957590852191c0e07541f`,
    hint: "You know the plaintext starts with 'flag{'. XOR the first ciphertext byte with the ASCII code for 'f' (0x66) to recover the key byte, then apply that key to every byte.",
    concept: "This 'known plaintext' trick — guessing part of the answer to derive the key — is a real cryptanalysis technique, not just a puzzle shortcut."
  },
  {
    id: 6, cat: "Encoding", diff: "easy", title: "URL Encoding Undone",
    hashHex: "24db68926330a66f3fb4f44f6cff7a731e2017217ead9f33502aeeada6b23468",
    brief: `<p>Percent-encoding (URL encoding) escapes characters that aren't safe in a URL — spaces, symbols, and anything outside the basic ASCII set — as <code>%</code> followed by two hex digits.</p><p>Decode the string below to find the flag.</p>`,
    terminal: `flag%7Bpercent_encoding_decoded%7D`,
    hint: "%7B and %7D are just the curly braces { and }. In a browser console, decodeURIComponent('...') does the rest.",
    concept: "Percent-encoding shows up constantly in query strings and web logs — learning to read it on sight speeds up any web-focused investigation."
  },
  {
    id: 7, cat: "Encoding", diff: "easy", title: "Binary Message",
    hashHex: "3fa843790979ef945af489e21fc577ba94fb9599a48906b320358aa00ff9e6c4",
    brief: `<p>Every character is ultimately just a number, and binary is the most literal way to write one down: eight bits per byte, using standard ASCII values.</p><p>Convert each 8-bit group below into a character to spell out the flag.</p>`,
    terminal: `01100110 01101100 01100001 01100111 01111011 01100010 01101001 01101110 01100001 01110010 01111001 01011111 01110100 01101111 01011111 01100001 01110011 01100011 01101001 01101001 01011111 01100011 01101111 01101110 01110110 01100101 01110010 01110011 01101001 01101111 01101110 01111101`,
    hint: "Group the bits in sets of 8, convert each group from base-2 to decimal, then map the decimal value to its ASCII character.",
    concept: "This is the same conversion your keyboard driver, terminal, and network stack do constantly — binary, hex, and text are all just different views of the same bytes."
  },
  {
    id: 8, cat: "Web", diff: "med", title: "JWT Inspector",
    hashHex: "239247fb9b5264ffb4d3cb3ef3bad74b63849e56573a215a038f088657c0ebad",
    brief: `<p>JSON Web Tokens (JWTs) are widely used for session and API authentication. A JWT has three dot-separated parts — header, payload, and signature — and the first two are just base64url-encoded JSON, <strong>not encrypted</strong>. Anyone can read them without knowing the signing key.</p><p>Decode the payload segment (the middle part, between the two dots) to find the flag inside it.</p>`,
    terminal: `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJndWVzdCIsInJvbGUiOiJ2aXNpdG9yIiwiZmxhZyI6ImZsYWd7and0X3BheWxvYWRzX2FyZV9qdXN0X2Jhc2U2NH0ifQ.4x2f9d8s7f9s8d7f9s8d7f9sd8f79s8df7`,
    hint: "Split on the dots and base64-decode the second segment. The signature (third segment) is what would actually need a secret key — you don't need it to read the claims.",
    concept: "This is a real-world lesson: never put secrets in a JWT payload. Anyone who can see the token can read every claim inside it, signature or not."
  },
  {
    id: 9, cat: "Web", diff: "med", title: "Cookie Crumbs",
    hashHex: "b16b4300e56bdd5af97a1be5b09037e5ffe5044d15fd06a8219d8de3b5a71760",
    brief: `<p>Cookies are small pieces of state a server asks the browser to store and resend. Session cookies should be opaque, random identifiers — but developers sometimes stuff readable (or weakly encoded) data straight into them, leaking information to anyone who opens dev tools.</p><p>Below is a simulated <code>Set-Cookie</code> response header from a login endpoint. Something in it isn't as opaque as it looks.</p>`,
    terminal: `Set-Cookie: session_id=8f14e45fceea167a5a36dedd4bea2543; Path=/; HttpOnly
Set-Cookie: user_pref=theme-dark; Path=/
Set-Cookie: debug_ctx=Y29va2llc19yZXZlYWxfc2VjcmV0cw%3D%3D; Path=/`,
    hint: "The session_id is a proper opaque hash — ignore it. The debug_ctx value has been through two encodings: percent-encoding on the outside, base64 underneath. Undo them in that order.",
    concept: "Real security reviews often start exactly like this: reading response headers in the Network tab and asking 'why does this cookie look decodable?'"
  },
  {
    id: 10, cat: "Web", diff: "med", title: "The Developer Console",
    hashHex: "9d306eb033aac8262dca52871f0caa435a3869c9dec70bb280d258c34b738fd4",
    brief: `<p>Not everything sensitive lives in the visible page. Developers routinely leave comments, hidden fields, and unused attributes in shipped HTML — and browser DevTools (or "View Page Source") will show all of it.</p><p>This final flag isn't printed above. Open this page's source or inspector and look for an HTML comment hiding near this challenge.</p>`,
    terminal: `<!-- rendered fragment -->
<div class="login-widget" data-status="disabled">
  Login temporarily unavailable.
</div>`,
    hint: "Right-click → 'View Page Source' (or Ctrl/Cmd+U), then search (Ctrl/Cmd+F) for the word 'flag'. It's tucked inside an HTML comment elsewhere in this document.",
    concept: "This is the single most common first step in real bug-hunting: read what actually shipped, not just what renders. Comments, source maps, and forgotten debug code are a recurring source of real vulnerabilities."
  }
];

let solved = {};
let activeId = null;

function catOrder(){ return ["Encoding","Crypto","Web"]; }

function renderSidebar(){
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';
  catOrder().forEach(cat => {
    const group = document.createElement('div');
    group.className = 'cat-group';
    const label = document.createElement('div');
    label.className = 'cat-label';
    label.textContent = cat;
    group.appendChild(label);
    challenges.filter(c => c.cat === cat).forEach(c => {
      const item = document.createElement('div');
      item.className = 'chal-item' + (c.id === activeId ? ' active' : '');
      item.onclick = () => openChallenge(c.id);
      const status = document.createElement('div');
      status.className = 'chal-status' + (solved[c.id] ? ' done' : '');
      status.textContent = solved[c.id] ? '✓' : '';
      const title = document.createElement('div');
      title.className = 'chal-title';
      title.textContent = c.title;
      const diff = document.createElement('div');
      diff.className = 'chal-diff ' + (c.diff === 'easy' ? 'easy' : 'med');
      diff.textContent = c.diff === 'easy' ? 'EASY' : 'MED';
      item.appendChild(status);
      item.appendChild(title);
      item.appendChild(diff);
      group.appendChild(item);
    });
    list.appendChild(group);
  });
  updateScore();
}

function updateScore(){
  const count = Object.values(solved).filter(Boolean).length;
  document.getElementById('scoreValue').textContent = count + ' / ' + challenges.length;
  document.getElementById('scoreBar').style.width = (count / challenges.length * 100) + '%';
}

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str.trim());
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function openChallenge(id){
  activeId = id;
  renderSidebar();
  renderMain(id);
}

function renderMain(id){
  const c = challenges.find(x => x.id === id);
  const main = document.getElementById('mainPanel');
  const isSolved = !!solved[id];
  main.innerHTML = `
    <div class="chal-header">
      <h2>${c.title}</h2>
    </div>
    <div class="chal-meta">
      <span class="pill">${c.cat}</span>
      <span class="pill">${c.diff === 'easy' ? 'Easy' : 'Medium'}</span>
      ${isSolved ? '<span class="pill" style="color:#3FB8AF;border-color:#1e4440;">Solved</span>' : ''}
    </div>
    <div class="brief">${c.brief}</div>
    <div class="terminal"><div class="tline"><span class="tprefix">$ </span>${escapeHtml(c.terminal)}</div></div>
    <div class="hint-block">
      <button class="hint-toggle" id="hintBtn">Show hint</button>
      <div class="hint-text" id="hintText">${c.hint}</div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="submit-row">
      <input type="text" id="flagInput" placeholder="flag{...}" autocomplete="off" spellcheck="false" ${isSolved ? 'disabled' : ''}>
      <button id="submitBtn" ${isSolved ? 'disabled' : ''}>${isSolved ? 'Solved' : 'Submit'}</button>
    </div>
    <div class="concept-note"><strong>Why it matters —</strong> ${c.concept}</div>
    <footer>${FLAG_FORMAT_HELP}</footer>
  `;

  document.getElementById('hintBtn').onclick = () => {
    document.getElementById('hintText').classList.toggle('show');
  };

  if (!isSolved){
    const submit = async () => {
      const input = document.getElementById('flagInput');
      const val = input.value;
      if (!val) return;
      const hash = await sha256Hex(val);
      const fb = document.getElementById('feedback');
      if (hash === c.hashHex){
        solved[id] = true;
        fb.className = 'feedback ok';
        fb.textContent = '✓ Correct — flag accepted.';
        renderSidebar();
        renderMain(id);
      } else {
        fb.className = 'feedback err';
        fb.textContent = '✗ Not quite. Double-check formatting and casing.';
      }
    };
    document.getElementById('submitBtn').onclick = submit;
    document.getElementById('flagInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') submit();
    });
  }
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderEmpty(){
  document.getElementById('mainPanel').innerHTML = `
    <div class="empty-state">
      <p style="color:var(--text);font-size:16px;margin-bottom:10px;">Pick a challenge from the left to begin.</p>
      <p>Each one teaches a specific encoding or crypto concept and takes a minute or two to solve. Flags are checked locally against a hash — nothing is sent anywhere.</p>
    </div>
  `;
}

renderSidebar();
renderEmpty();
</script>
</body>
</html>
